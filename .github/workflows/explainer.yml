# Checks every explainer example without the voice model, ffmpeg or a venv: lint each script, then run the pronunciation
# gate in --check-only mode. Both use the standard library only, so a bad scenes.json or a term missing from the lexicon
# fails here, before merge, without the ~350 MB Kokoro model or ELEVENLABS_API_KEY.
name: explainer

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # GitHub runs each step with bash -e, so the first failing example ends the job. An examples directory with no
      # scenes.json at all is an error too, not a quiet pass.
      - name: lint every example script
        run: |
          found=0
          for d in explainer/examples/*/; do
            [ -f "$d/scenes.json" ] || continue
            found=1
            python3 explainer/lint.py "$d"
          done
          [ "$found" = 1 ] || { echo "::error::no explainer/examples/*/scenes.json found"; exit 1; }
      - name: pronunciation gate of every example
        run: |
          for d in explainer/examples/*/; do
            [ -f "$d/scenes.json" ] || continue
            python3 explainer/voice/tts.py "$d" --check-only
          done
